services:
  - type: web
    name: afriresq-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: DATA_DIR
        value: ./data
      - key: CORS_ORIGIN
        value: ""
      - key: LOG_LEVEL
        value: info
